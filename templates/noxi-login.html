<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Noxi — Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='noxi-login.css') }}">
</head>

<body>

    <!-- ==================== LOGIN PAGE ==================== -->

    <main class="login-page">

        <!-- ==================== LOGIN CARD ==================== -->

        <section class="login-card">

            <div class="login-logo">
                🤖
            </div>

            <h1>NOXI</h1>

            <p class="login-subtitle">
                Your student AI assistant
            </p>


            <!-- ==================== FORM ==================== -->

            <form id="loginForm">

                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- ==================== LOGIN BUTTON ==================== -->

                <button
                    type="submit"
                    id="loginBtn"
                    class="primary-btn"
                >
                    LOGIN
                </button>

            </form>


            <!-- ==================== STATUS ==================== -->

            <p id="loginStatus" class="login-status"></p>


            <!-- ==================== SIGN UP ==================== -->

            <div class="signup-area">

                <span>Don't have an account?</span>

                <button
                    type="button"
                    id="signupBtn"
                    class="signup-btn"
                >
                    Create account
                </button>

            </div>

        </section>

    </main>


    <!-- ==================== FIREBASE ==================== -->

    <script type="module"
            src="{{ url_for('static', filename='noxi-login.js') }}">
    </script>

</body>

</html>
